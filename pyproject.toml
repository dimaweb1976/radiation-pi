[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radiation-pi"
version = "0.1.0"
description = "Raspberry Pi client for Radiation Monitor"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
radiation-pi = "radiation_pi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
